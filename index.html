    <title>BulkTrack</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./public/icons/icon-192.png" />
    <script>
      (function () {
        var path = location.pathname.replace(/index\.html$/i, '');
        if (path.slice(-1) !== '/') path += '/';
        if (path.indexOf('/docs/') !== -1 || /\/docs\/?$/.test(path)) return;
        location.replace(path + 'docs/' + location.search + location.hash);
      })();
    </script>
